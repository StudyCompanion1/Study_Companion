[project]
name = "study-companion"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Michael Meyers", email = "michaelmeyers409111@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets tests `import app` when run from backend/
pythonpath = ["."]
